<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 role="heading">My Portfolio</h1>
    </header>

    <nav role="navigation" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="about">
            <img
                role="img"
                src="https://via.placeholder.com/200"
                alt="Profile portrait"
            >

            <p>
                Hello! I am a web developer passionate about creating
                accessible and responsive websites.
            </p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>

            <ul role="list">
                <li role="listitem">HTML</li>
                <li role="listitem">CSS</li>
                <li role="listitem">JavaScript</li>
            </ul>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Email: example@email.com</p>
        </section>
    </main>

</body>
</html>
